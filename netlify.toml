# Netlify configuration — https://docs.netlify.com/configure-builds/file-based-configuration/
# Settings here override the ones in the Netlify UI.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built assets have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the semi-hidden After Hours section out of search engines (the pages also carry a robots meta tag).
[[headers]]
  for = "/after-hours"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/after-hours/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
